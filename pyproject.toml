[build-system]
requires = [
    "setuptools >= 78.1.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "classic-migrations"
version = "3.0.0"
description = "Database migrations with SQL"
readme = "README.rst"
authors = [
    { name = "Sergey Variasov", email = "variasov@gmail.com" },
]
keywords = ["migrations", "migrate", "database", "alembic", "south"]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "sqlparse~=0.6",
    "typing_extensions>=4.6; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/variasov/classic-migrations"

[project.optional-dependencies]
mysql = ["PyMySQL~=1.2"]
oracle = ["oracledb~=3.1"]
postgres = ["psycopg~=3.3", "psycopg-binary~=3.3"]
pymssql = ["pymssql~=2.3"]

[project.scripts]
migrations = "classic.migrations.cli:main"

[dependency-groups]
dev = [
    "pyright[nodejs]~=1.1.411",
    "pytest~=9.1.1",
    "pytest-cov~=7.1",
    "ruff~=0.16.4",
    "oracledb~=3.1",
    "psycopg~=3.3",
    "psycopg-binary~=3.3",
    "pymysql~=1.2",
    "pymssql~=2.3",
    "vulture~=2.16",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"classic.migrations" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=classic --cov-report=term-missing"

[tool.coverage.run]
source = ["classic"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    ".venv",
]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
extraPaths = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",     # keeps D211: no blank line before class docstring
    "D213",     # keeps D212: multi-line summary on first line
    "EM",       # error-message style is overly prescriptive
    "TRY003",   # long exception messages are an API concern
    "ANN401",   # DB driver objects are dynamically typed
    "N802",     # Settings properties mirror environment variable names
    "N818",     # exception names are part of the public API
    "A002",     # Migration(id=...) is defined by the spec
    "A003",     # MigrationsCollection.list() is defined by the spec
    "COM812",   # conflicts with the ruff formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "SLF001",
    "S101",     # `assert` is idiomatic in pytest
    "D",        # tests do not need docstrings
    "ANN",      # test annotations are optional
    "FBT",      # boolean positional args in test helpers
    "PLR2004",  # magic values are acceptable in assertions
    "PLR0913",  # many-argument test helpers
    "PT011",    # broad pytest.raises is acceptable in tests
    "PT012",    # pytest.raises blocks may legitimately hold several statements
    "ARG",      # unused fixture/helper args
    "CPY001",   # tests do not carry copyright headers
    "S608",     # SQL strings in tests are not injection vectors
]
"src/classic/migrations/backends/*.py" = [
    "S608",     # identifier interpolation is quoted and intentional
]
"src/classic/migrations/backends/base.py" = [
    "PLR0913",  # connection config takes many explicit kwargs
    "PLR0917",
]
"src/classic/migrations/migrator.py" = [
    "FBT",      # apply/rollback take a spec-defined `fake` flag
    "PLR0913",  # connection config takes many explicit kwargs
    "PLR0917",
]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 60
ignore_names = [
    "isolation_level",  # sqlite3.Connection attribute set for autocommit
    "paramstyle",       # DB-API attribute of the fake driver
    "pytestmark",       # read by pytest
    "return_value",     # Mock configuration in tests
    "side_effect",
]

[tool.mutmut]
source_paths = ["src/classic/migrations"]
pytest_add_cli_args = ["-o", "addopts="]
mutate_only_covered_lines = true
do_not_mutate = [
    "src/classic/migrations/backends/oracle.py",
    "src/classic/migrations/backends/psycopg.py",
    "src/classic/migrations/backends/pymysql.py",
    "src/classic/migrations/backends/pymssql.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_migrations.py",
    "tests/test_migrator.py",
    "tests/test_cli.py",
    "tests/test_settings.py",
    "tests/test_package.py",
    "tests/test_integration.py",
    "tests/test_backend_base.py",
    "tests/backends/test_sqlite3.py",
]
